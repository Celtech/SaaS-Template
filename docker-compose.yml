services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-change-me-in-env-file}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-secret}@db:5432/saas_template?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: redis://valkey:6379/messages
      SCHEDULER_DSN: redis://valkey:6379/scheduler
      MAILER_DSN: smtp://mailpit:1025
      SERVER_NAME: "localhost, :80"
      CADDY_GLOBAL_OPTIONS: "debug"
      LOG_LEVEL: DEBUG
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-change-me-in-env-file}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-secret}@db:5432/saas_template?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: redis://valkey:6379/messages
      SCHEDULER_DSN: redis://valkey:6379/scheduler
      MAILER_DSN: smtp://mailpit:1025
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 -vv
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saas_template
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d saas_template"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  db_data:
  valkey_data:
  vendor_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
