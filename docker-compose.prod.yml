services:
  app:
    build:
      context: .
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      SCHEDULER_DSN: ${SCHEDULER_DSN}
      MAILER_DSN: ${MAILER_DSN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      SERVER_NAME: ${SERVER_NAME}
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      SCHEDULER_DSN: ${SCHEDULER_DSN}
      MAILER_DSN: ${MAILER_DSN}
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=256M
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: always

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_template}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-saas_template}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --appendonly yes
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  db_data:
  valkey_data:
