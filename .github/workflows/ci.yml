name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  APP_DEBUG: "0"
  APP_SECRET: ci-secret-not-used-in-production
  DATABASE_URL: postgresql://app:secret@127.0.0.1:5432/saas_template?serverVersion=17&charset=utf8
  MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
  SCHEDULER_DSN: redis://127.0.0.1:6379/scheduler
  LOCK_DSN: flock
  MAILER_DSN: null://null
  MAILER_FROM_ADDRESS: noreply@localhost
  MAILER_FROM_NAME: "SaaS Template CI"
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  DEFAULT_URI: http://localhost

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas_template
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, intl, opcache, pdo_pgsql, redis, zip
          coverage: xdebug
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Cache frontend vendor assets
        uses: actions/cache@v4
        with:
          path: assets/vendor
          key: importmap-${{ runner.os }}-${{ hashFiles('importmap.php') }}
          restore-keys: |
            importmap-${{ runner.os }}-

      # bootEnv() in post-install-cmd (cache:clear) requires .env to exist;
      # actual config comes from the workflow env vars above
      - name: Create stub .env for Symfony bootEnv
        run: touch .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend vendor assets
        run: php bin/console importmap:install

      - name: Create and migrate test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run unit tests
        run: php bin/phpunit --testsuite=unit --log-junit var/log/junit-unit.xml

      - name: Run functional tests
        run: php bin/phpunit --testsuite=functional --log-junit var/log/junit-functional.xml

      - name: Run integration tests
        run: php bin/phpunit --testsuite=integration --log-junit var/log/junit-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}
          path: var/log/junit-*.xml
          retention-days: 7

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, intl, opcache, pdo_pgsql, redis, zip
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      # bootEnv() in post-install-cmd (cache:clear) requires .env to exist
      - name: Create stub .env for Symfony bootEnv
        run: touch .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm dev cache for PHPStan container inspection
        env:
          APP_ENV: dev
          APP_DEBUG: "1"
          APP_SECRET: stan-placeholder
          DATABASE_URL: postgresql://app:secret@127.0.0.1:5432/saas_template?serverVersion=17&charset=utf8
          MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
          SCHEDULER_DSN: redis://127.0.0.1:6379/scheduler
          LOCK_DSN: flock
          MAILER_DSN: null://null
          MAILER_FROM_ADDRESS: noreply@localhost
          MAILER_FROM_NAME: CI
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          DEFAULT_URI: http://localhost
        run: php bin/console cache:warmup --env=dev

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
