framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        pools:
            # Tracks processed Stripe event IDs for webhook idempotency.
            # TTL is 7 days — longer than Stripe's 3-day retry window.
            cache.stripe_webhooks:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'
                default_lifetime: 604800

            # Caches the full entitlement map per org. Invalidated on any
            # subscription change. TTL is 1 hour as a safety net.
            cache.entitlements:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'
                default_lifetime: 3600

            # Tracks OAuth access token validity. Avoids a DB hit on every API
            # request. Revoked tokens are marked with a 5-minute TTL tombstone.
            cache.oauth_tokens:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'
                default_lifetime: 3600

            # Backs the api_client/api_org RateLimiter counters (see rate_limiter.yaml).
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'

            # Stores completed responses for Idempotency-Key replay on /api/* mutating
            # requests (see IdempotencyKeyListener). TTL is set per-item (24h) by the
            # listener itself, not here.
            cache.idempotency:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'

when@test:
    framework:
        cache:
            pools:
                cache.stripe_webhooks:
                    adapter: cache.adapter.array
                    provider: ~
                cache.entitlements:
                    adapter: cache.adapter.array
                    provider: ~
                cache.oauth_tokens:
                    adapter: cache.adapter.array
                    provider: ~
                # Not cache.adapter.array for these two: ArrayAdapter implements
                # ResettableInterface and gets wiped by Symfony's services_resetter
                # after every single request in a functional test — which would
                # silently defeat both rate limiting and idempotency replay, since
                # every request would see freshly reset state. Filesystem isn't reset.
                cache.rate_limiter:
                    adapter: cache.adapter.filesystem
                    provider: ~
                cache.idempotency:
                    adapter: cache.adapter.filesystem
                    provider: ~
