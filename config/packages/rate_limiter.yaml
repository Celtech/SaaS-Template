framework:
    rate_limiter:
        api_client:
            policy: 'sliding_window'
            limit: '%env(int:API_RATE_LIMIT_CLIENT_PER_MINUTE)%'
            interval: '1 minute'
        api_org:
            policy: 'sliding_window'
            limit: '%env(int:API_RATE_LIMIT_ORG_PER_MINUTE)%'
            interval: '1 minute'
        auth_register:
            policy: 'sliding_window'
            limit: '%env(int:AUTH_RATE_LIMIT_REGISTER_PER_HOUR)%'
            interval: '1 hour'
        auth_forgot_password:
            policy: 'sliding_window'
            limit: '%env(int:AUTH_RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR)%'
            interval: '1 hour'
