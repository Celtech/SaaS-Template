security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            custom_authenticator: App\Security\OAuthTokenAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                auth_code_parameter_name: _auth_code
            logout:
                path: auth_logout
                target: auth_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
            entry_point: App\Security\AppAuthenticator
            switch_user:
                role: ROLE_ALLOWED_TO_SWITCH
                parameter: _switch_user

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_USER, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/.well-known, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/token, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/revoke, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/introspect, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/device/authorization, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
