framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            failed: 'doctrine://default?queue_name=failed'

        routing:
            'App\Message\Webhook\DeliverWebhookMessage': async
            'App\Message\Mail\SendMailMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
