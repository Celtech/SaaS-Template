# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Trust X-Forwarded-* headers from the configured proxy IPs so that
    # Request::getClientIp() returns the real client IP in audit logs.
    # Production: set TRUSTED_PROXIES to the load-balancer IP/CIDR (e.g. 10.0.0.0/8).
    # Dev/Docker: loopback default so FrankenPHP's forwarded headers are trusted.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
