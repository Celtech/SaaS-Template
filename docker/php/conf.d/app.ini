; Shared PHP configuration (all environments)
date.timezone=UTC
memory_limit=256M
max_execution_time=30

; APCu
apc.enable_cli=1

; OPcache — validate_timestamps is env-specific (dev=1, prod=0)
opcache.enable=1
opcache.revalidate_freq=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1

; Upload limits
upload_max_filesize=10M
post_max_size=10M
